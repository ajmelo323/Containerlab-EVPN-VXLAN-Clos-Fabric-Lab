frr version 8.4_git
frr defaults traditional
hostname leaf3
no ipv6 forwarding
!
interface eth1
 ip address 10.0.3.1/31
exit
!
interface eth2
 ip address 10.0.3.3/31
exit
!
interface lo
 ip address 10.255.0.13/32
exit
!
router bgp 65103
 bgp router-id 10.255.0.13
 no bgp ebgp-requires-policy
 neighbor 10.0.3.0 remote-as 65000
 neighbor 10.0.3.2 remote-as 65000
 !
 address-family ipv4 unicast
  network 10.255.0.13/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.3.0 activate
  neighbor 10.0.3.2 activate
  advertise-all-vni
  vni 100
   route-target import 100:100
   route-target export 100:100
  exit-vni
 exit-address-family
exit
!

frr version 8.4_git
frr defaults traditional
hostname spine2
no ipv6 forwarding
!
interface eth1
 ip address 10.0.1.2/31
exit
!
interface eth2
 ip address 10.0.2.2/31
exit
!
interface eth3
 ip address 10.0.3.2/31
exit
!
interface lo
 ip address 10.255.0.2/32
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.1.3 remote-as 65101
 neighbor 10.0.2.3 remote-as 65102
 neighbor 10.0.3.3 remote-as 65103
 !
 address-family l2vpn evpn
  neighbor 10.0.1.3 activate
  neighbor 10.0.2.3 activate
  neighbor 10.0.3.3 activate
 exit-address-family
exit
!
